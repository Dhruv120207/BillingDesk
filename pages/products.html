<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products — Billing Software</title>
  <link rel="stylesheet" href="../style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(13, 31, 51, 0.45);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .modal-box {
      background: #fff;
      border-radius: var(--radius);
      padding: 24px;
      width: 420px;
      max-width: 90vw;
      box-shadow: var(--shadow-md);
    }
    .modal-box h2 { margin-bottom: 16px; }
    .low-stock { color: var(--color-danger); font-weight: 600; }
  </style>
</head>
<body data-page="products">
  <div class="app-shell">
    <div id="sidebar-root"></div>

    <main class="main">
      <div class="topbar">
        <div>
          <h1>Products</h1>
          <p>Manage what you sell — used for autocomplete on Create Bill.</p>
        </div>
        <button class="btn btn-primary" id="add-product-btn">+ Add Product</button>
      </div>

      <div class="card mb-16">
        <div class="field" style="max-width:340px;">
          <label for="product-search">Search</label>
          <input type="text" id="product-search" placeholder="Product name or code" />
        </div>
      </div>

      <div class="card">
        <table>
          <thead>
            <tr>
              <th>Product Name</th>
              <th>Code</th>
              <th class="money">Price</th>
              <th class="money">Stock</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="products-tbody"></tbody>
        </table>
        <div id="no-products-msg" class="text-muted mt-16" style="display:none;">No products found.</div>
        <div id="loading-msg" class="text-muted mt-16">Loading products...</div>
      </div>
    </main>
  </div>

  <!-- Add/Edit modal -->
  <div class="modal-backdrop" id="product-modal">
    <div class="modal-box">
      <h2 id="modal-title">Add Product</h2>
      <input type="hidden" id="product-id-field" />
      <div class="field" id="name-field">
        <label for="product-name-field">Product Name</label>
        <input type="text" id="product-name-field" />
        <div class="error-text">Product name is required.</div>
      </div>
      <div class="field">
        <label for="product-code-field">Product Code (optional)</label>
        <input type="text" id="product-code-field" placeholder="e.g. SKU-001" />
      </div>
      <div class="form-row">
        <div class="field" id="price-field">
          <label for="product-price-field">Price (₹)</label>
          <input type="number" id="product-price-field" min="0" step="0.01" />
          <div class="error-text">Price must be 0 or more.</div>
        </div>
        <div class="field">
          <label for="product-stock-field">Stock Quantity</label>
          <input type="number" id="product-stock-field" min="0" step="1" value="0" />
        </div>
      </div>
      <div class="flex gap-8 mt-16">
        <button class="btn btn-primary" id="save-product-btn">Save</button>
        <button class="btn btn-secondary" id="cancel-modal-btn">Cancel</button>
      </div>
    </div>
  </div>

  <script src="../config.js"></script>
  <script src="../app.js"></script>
  <script src="products.js"></script>
</body>
</html>
