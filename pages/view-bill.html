<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>View Bill — Billing Software</title>
  <link rel="stylesheet" href="../style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .invoice-box {
      max-width: 800px;
      margin: 0 auto;
      background: #fff;
      padding: 40px;
    }
    .invoice-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 2px solid var(--color-border);
      padding-bottom: 20px;
      margin-bottom: 20px;
    }
    .logo-placeholder {
      width: 64px;
      height: 64px;
      border: 2px dashed var(--color-border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: var(--color-text-muted);
      text-align: center;
    }
    .logo img {
    width: 120px;
    height: auto;
    display: block;
}
    .business-name {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
      color: var(--color-primary-dark);
    }
    .invoice-meta {
      text-align: right;
      font-size: 13px;
      color: var(--color-text-muted);
    }
    .invoice-meta .bill-no {
      font-family: var(--font-ledger);
      font-size: 18px;
      font-weight: 700;
      color: var(--color-primary-dark);
    }
    .customer-block {
      display: flex;
      justify-content: space-between;
      margin-bottom: 24px;
      font-size: 14px;
    }
    .customer-block h3 { margin-bottom: 6px; }
    .invoice-table th, .invoice-table td { font-size: 13px; }
    .invoice-totals {
      max-width: 300px;
      margin-left: auto;
      margin-top: 16px;
    }
    .invoice-totals .row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 14px; }
    .invoice-totals .row.grand {
      border-top: 2px solid var(--color-border);
      margin-top: 6px;
      padding-top: 10px;
      font-weight: 700;
      font-size: 18px;
      font-family: var(--font-ledger);
    }
    .payment-line { margin-top: 20px; font-size: 14px; }
    .action-bar { max-width: 800px; margin: 0 auto 16px auto; display: flex; justify-content: flex-end; gap: 8px; }
    #not-found-msg, #loading-msg { text-align: center; padding: 60px 0; color: var(--color-text-muted); }
  </style>
</head>
<body data-page="">
  <div class="app-shell">
    <div id="sidebar-root" class="no-print"></div>

    <main class="main">
      <div class="action-bar no-print">
  <a href="bill-history.html" class="btn btn-secondary">← Back to Bill History</a>
  <button class="btn btn-secondary" id="edit-btn">Edit</button>
  <button class="btn btn-danger" id="delete-btn">Delete</button>
  <button class="btn btn-primary" id="print-btn">Print</button>
</div>

      <div id="loading-msg">Loading bill...</div>
      <div id="not-found-msg" style="display:none;">Bill not found.</div>

      <div class="invoice-box card" id="invoice-content" style="display:none;">
        <div class="invoice-header">
          <div class="flex gap-8">
<div class="logo">
    <img src="/ishalogo.jpeg" alt="Isha designer Logo">
</div>            <div>
              <div class="business-name" id="business-name">Your Business Name</div>
              <div class="text-muted" style="font-size:13px;" id="business-details">—</div>
            </div>
          </div>
          <div class="invoice-meta">
            <div class="bill-no" id="bill-no">—</div>
            <div id="bill-date">—</div>
            <div id="bill-time">—</div>
          </div>
        </div>

        <div class="customer-block">
          <div>
            <h3>Billed To</h3>
            <div id="customer-name">—</div>
            <div id="customer-mobile" class="text-muted"></div>
          </div>
        </div>

        <table class="invoice-table">
          <thead>
            <tr>
              <th>Product</th>
              <th>Qty</th>
              <th class="money">Rate</th>
              <th class="money">Discount</th>
              <th class="money">GST</th>
              <th class="money">Total</th>
            </tr>
          </thead>
          <tbody id="items-tbody"></tbody>
        </table>

        <div class="invoice-totals">
          <div class="row"><span class="text-muted">Subtotal</span><span class="money" id="inv-subtotal">₹0.00</span></div>
          <div class="row"><span class="text-muted">Discount</span><span class="money" id="inv-discount">₹0.00</span></div>
          <div class="row"><span class="text-muted">GST</span><span class="money" id="inv-gst">₹0.00</span></div>
          <div class="row grand"><span>Grand Total</span><span class="money" id="inv-grand">₹0.00</span></div>
        </div>

        <div class="payment-line">
          <strong>Payment Method:</strong> <span id="payment-method">—</span>
        </div>
      </div>
    </main>
  </div>

  <script src="../config.js"></script>
  <script src="../app.js"></script>
  <script src="view-bill.js"></script>
</body>
</html>
